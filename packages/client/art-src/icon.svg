<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Bladerift app icon: two crossed swords over a gold rift in a violet dusk. Full-bleed; key art kept inside the central maskable safe zone (r = 205). -->
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1638"/>
      <stop offset="1" stop-color="#0d0a14"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="256" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e9b64a" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#e9b64a" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#e9b64a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f8aa3"/>
      <stop offset="0.5" stop-color="#f6f8ff"/>
      <stop offset="1" stop-color="#a9b3c7"/>
    </linearGradient>
  </defs>
  <g id="art">
    <rect width="512" height="512" fill="url(#dusk)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <!-- the rift: a jagged crack of gold light down the middle -->
    <g fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M236 -10 L250 70 L226 130 L258 196 L240 256 L268 318 L252 380 L276 448 L258 522" stroke="#e9b64a" stroke-width="50" stroke-opacity="0.14"/>
      <path d="M236 -10 L250 70 L226 130 L258 196 L240 256 L268 318 L252 380 L276 448 L258 522" stroke="#e9b64a" stroke-width="22" stroke-opacity="0.35"/>
      <path d="M236 -10 L250 70 L226 130 L258 196 L240 256 L268 318 L252 380 L276 448 L258 522" stroke="#e9b64a" stroke-width="9"/>
      <path d="M236 -10 L250 70 L226 130 L258 196 L240 256 L268 318 L252 380 L276 448 L258 522" stroke="#fff1c4" stroke-width="3" stroke-opacity="0.9"/>
    </g>
    <!-- two swords crossed in an X; each is drawn tip-up, then rotated and scaled about the centre -->
    <g transform="translate(256 256) rotate(45) scale(1.45) translate(0 34)" stroke="#0d0a14" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M0 -140 L17 -90 L19 -18 L-19 -18 L-17 -90 Z" fill="url(#steel)"/>
      <path d="M0 -122 V-30" stroke="#6b7690" stroke-width="3" fill="none"/>
      <rect x="-54" y="-24" width="108" height="14" rx="5" fill="#e9b64a"/>
      <rect x="-7" y="-10" width="14" height="62" rx="4" fill="#4a2a5c"/>
      <circle cx="0" cy="60" r="12" fill="#e9b64a"/>
    </g>
    <g transform="translate(256 256) rotate(-45) scale(1.45) translate(0 34)" stroke="#0d0a14" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M0 -140 L17 -90 L19 -18 L-19 -18 L-17 -90 Z" fill="url(#steel)"/>
      <path d="M0 -122 V-30" stroke="#6b7690" stroke-width="3" fill="none"/>
      <rect x="-54" y="-24" width="108" height="14" rx="5" fill="#e9b64a"/>
      <rect x="-7" y="-10" width="14" height="62" rx="4" fill="#4a2a5c"/>
      <circle cx="0" cy="60" r="12" fill="#e9b64a"/>
    </g>
  </g>
</svg>
